name: Check data and deploy

# Every push is checked. Only a push to main that passes the check is deployed.
# If the check fails, the live site stays on the last good version.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check flood.json / ตรวจสอบข้อมูล
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate.mjs

  deploy:
    name: Deploy to GitHub Pages / เผยแพร่
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions replace the workflow-level ones, so contents: read is repeated here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Embed fallback copy of the data into index.html
        run: node scripts/embed-fallback.mjs
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html style.css app.js sw.js og-image.png .nojekyll _site/
          cp -r data fonts _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
