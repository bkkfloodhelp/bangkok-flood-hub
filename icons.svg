<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Section icons, drawn for this site. 24x24 grid, 2px round strokes, no fill; colour comes from
       the surrounding text (currentColor), so light/dark mode and print just work.
       Use: <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-phone"/></svg>
       scripts/embed-fallback.mjs copies this file into each page at build time. -->
